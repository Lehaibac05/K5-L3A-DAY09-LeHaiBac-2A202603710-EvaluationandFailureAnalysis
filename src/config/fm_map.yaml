# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03         # ticket/injection states a delay the DB does not hold
stale_policy: FM-06           # superseded (SHIP-LATE-OLD) or not-yet-effective (SHIP-LATE-FUTURE) clause
clause_sum: FM-04             # "cộng cả hai khoản": sum clause parts instead of max
double_deduct: FM-05          # prior refund on the order deducted by agent and host
sibling_refund: FM-07         # "gom đơn": refund written under sibling claims
denied_ignored: FM-02         # expired / used-up approval, host denies, agent says resolved
reply_ledger_mismatch: FM-08  # approval caps the host below the quote; reply must say the ledger amount
cross_principal: FM-09        # another principal (admin/family/staff claim) asks for someone else's order
